# Tạo môi trường:   conda env create -f environment.yml
# Kích hoạt:         conda activate mixup
#
# torch được cài qua pip vì kênh "pytorch" của conda đã ngừng phát hành từ bản 2.6.
# Máy có GPU NVIDIA: sau khi tạo môi trường, cài lại torch bản CUDA theo lệnh trên
# https://pytorch.org/get-started/locally/ , ví dụ:
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
name: mixup
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24
  - pandas>=2.0
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - pytest>=7.0
  - pip
  - pip:
      - torch>=2.3
      - torchvision>=0.18
      - wandb>=0.16
